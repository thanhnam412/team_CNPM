<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        [data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen overflow-hidden">
<!-- Blurred Background Context (Simulated Dashboard) -->
<div class="fixed inset-0 z-0 bg-surface blur-[4px] opacity-60 transition-opacity duration-300">
<div class="container mx-auto px-8 py-16 grid grid-cols-12 gap-8">
<div class="col-span-12 h-32 bg-surface-container rounded-lg border border-outline-variant"></div>
<div class="col-span-8 h-96 bg-surface-container rounded-lg border border-outline-variant"></div>
<div class="col-span-4 h-96 bg-surface-container rounded-lg border border-outline-variant"></div>
</div>
</div>
<!-- Modal Overlay Backdrop -->
<div class="fixed inset-0 z-40 bg-on-background/20 backdrop-blur-sm flex items-center justify-center p-4">
<!-- Modal Container (Level 3 Elevation) -->
<div class="bg-surface-container-lowest w-full max-w-2xl rounded-xl border border-outline-variant shadow-xl overflow-hidden flex flex-col max-h-[921px]">
<!-- Modal Header -->
<div class="px-6 py-4 border-b border-outline-variant flex items-center justify-between bg-surface-container-lowest">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center">
<span class="material-symbols-outlined" data-weight="fill">admin_panel_settings</span>
</div>
<div>
<h2 class="font-h3 text-h3 text-on-surface">Manual Reputation Adjustment</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Override trust score for User ID: USR-84920</p>
</div>
</div>
<button class="text-on-surface-variant hover:text-on-surface transition-colors p-2 rounded-full hover:bg-surface-container-high">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="p-6 overflow-y-auto flex-1 bg-surface-bright">
<!-- Current Status Card -->
<div class="mb-8 bg-surface-container-low rounded-lg p-4 border border-outline-variant flex items-center justify-between">
<div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider block mb-1">Current Score</span>
<div class="flex items-baseline gap-2">
<span class="font-h2 text-h2 text-on-surface">742</span>
<span class="font-body-sm text-body-sm text-primary font-medium">/ 1000</span>
</div>
</div>
<div class="h-12 w-px bg-outline-variant mx-4"></div>
<div class="flex-1 text-right">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider block mb-1">Reputation Tier</span>
<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-secondary-container text-on-secondary-container font-label-md text-label-md">
<span class="material-symbols-outlined text-[16px]" data-weight="fill">verified</span>
                             Trusted
                         </span>
</div>
</div>
<form class="space-y-6" id="adjustmentForm">
<!-- Row 1: Type & Value -->
<div class="grid grid-cols-2 gap-6">
<!-- Adjustment Type -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface">Adjustment Type</label>
<div class="flex rounded-lg border border-outline-variant overflow-hidden bg-surface-container-lowest">
<label class="flex-1 text-center cursor-pointer relative">
<input checked="" class="peer sr-only" name="adjType" onchange="updatePreview()" type="radio" value="bonus"/>
<div class="py-2.5 font-label-md text-label-md peer-checked:bg-primary-container peer-checked:text-on-primary-container text-on-surface-variant transition-colors hover:bg-surface-container">
                                        Bonus (+ )
                                    </div>
</label>
<div class="w-px bg-outline-variant"></div>
<label class="flex-1 text-center cursor-pointer relative">
<input class="peer sr-only" name="adjType" onchange="updatePreview()" type="radio" value="penalty"/>
<div class="py-2.5 font-label-md text-label-md peer-checked:bg-error-container peer-checked:text-on-error-container text-on-surface-variant transition-colors hover:bg-surface-container">
                                        Penalty (- )
                                    </div>
</label>
</div>
</div>
<!-- Point Value -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface" for="pointValue">Point Value</label>
<div class="relative">
<input class="w-full h-[40px] px-3 bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-body-md text-on-surface pr-12" id="pointValue" max="100" min="1" oninput="updatePreview()" type="number" value="50"/>
<span class="absolute right-3 top-1/2 -translate-y-1/2 font-body-sm text-body-sm text-on-surface-variant">pts</span>
</div>
</div>
</div>
<!-- Row 2: Category -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface" for="reasonCategory">Reason Category</label>
<div class="relative">
<select class="w-full h-[40px] pl-3 pr-10 bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-body-md text-on-surface appearance-none" id="reasonCategory">
<option value="exceptional">Exceptional Service</option>
<option value="violation">Policy Violation</option>
<option value="technical">Technical Error Correction</option>
<option value="other">Other Override</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<!-- Row 3: Justification -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface flex justify-between" for="justification">
                            Detailed Justification
                            <span class="text-on-surface-variant font-normal">Required for audit logs</span>
</label>
<textarea class="w-full p-3 bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-sm text-body-sm text-on-surface resize-none placeholder:text-outline" id="justification" placeholder="Provide specific details regarding this manual adjustment..." rows="4"></textarea>
</div>
<!-- Live Preview Panel -->
<div class="mt-6 bg-surface-container rounded-lg p-5 border border-outline-variant border-l-4 border-l-primary" id="previewPanel">
<h4 class="font-label-md text-label-md text-on-surface mb-3 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">visibility</span>
                            Adjustment Preview
                        </h4>
<div class="flex items-center justify-between">
<div class="text-center">
<span class="font-body-sm text-body-sm text-on-surface-variant block">Current</span>
<span class="font-h3 text-h3 text-on-surface block mt-1">742</span>
</div>
<div class="flex-1 flex items-center justify-center px-4 relative">
<div class="w-full h-px bg-outline-variant absolute top-1/2 -translate-y-1/2 -z-10"></div>
<div class="bg-primary-container text-on-primary-container px-3 py-1 rounded-full font-label-sm text-label-sm font-bold flex items-center gap-1 z-10 shadow-[0_0_0_4px_theme(colors.surface-container)]" id="previewBadge">
<span class="material-symbols-outlined text-[14px]">arrow_upward</span>
                                    +50 pts
                                </div>
</div>
<div class="text-center">
<span class="font-body-sm text-body-sm text-on-surface-variant block">New Score</span>
<span class="font-h3 text-h3 text-primary block mt-1" id="newScore">792</span>
</div>
</div>
</div>
</form>
</div>
<!-- Modal Footer -->
<div class="px-6 py-4 border-t border-outline-variant bg-surface-container-lowest flex justify-end gap-3">
<button class="h-[40px] px-4 rounded border border-outline-variant bg-surface-container-lowest text-on-surface font-label-md text-label-md hover:bg-surface-container-low transition-colors" type="button">
                    Cancel
                </button>
<button class="h-[40px] px-6 rounded bg-primary text-on-primary font-label-md text-label-md hover:bg-primary/90 transition-colors flex items-center gap-2" type="button">
<span class="material-symbols-outlined text-[18px]">gavel</span>
                    Apply Override
                </button>
</div>
</div>
</div>
<script>
        const baseScore = 742;

        function updatePreview() {
            const isBonus = document.querySelector('input[name="adjType"]:checked').value === 'bonus';
            const valInput = document.getElementById('pointValue').value;
            const pts = parseInt(valInput, 10) || 0;
            
            const badge = document.getElementById('previewBadge');
            const newScoreEl = document.getElementById('newScore');
            const panel = document.getElementById('previewPanel');

            if (isBonus) {
                badge.className = 'bg-primary-container text-on-primary-container px-3 py-1 rounded-full font-label-sm text-label-sm font-bold flex items-center gap-1 z-10 shadow-[0_0_0_4px_theme(colors.surface-container)]';
                badge.innerHTML = `<span class="material-symbols-outlined text-[14px]">arrow_upward</span>+${pts} pts`;
                newScoreEl.textContent = baseScore + pts;
                newScoreEl.className = 'font-h3 text-h3 text-primary block mt-1';
                panel.className = 'mt-6 bg-surface-container rounded-lg p-5 border border-outline-variant border-l-4 border-l-primary transition-all duration-300';
            } else {
                badge.className = 'bg-error-container text-on-error-container px-3 py-1 rounded-full font-label-sm text-label-sm font-bold flex items-center gap-1 z-10 shadow-[0_0_0_4px_theme(colors.surface-container)]';
                badge.innerHTML = `<span class="material-symbols-outlined text-[14px]">arrow_downward</span>-${pts} pts`;
                newScoreEl.textContent = Math.max(0, baseScore - pts);
                newScoreEl.className = 'font-h3 text-h3 text-error block mt-1';
                panel.className = 'mt-6 bg-surface-container rounded-lg p-5 border border-outline-variant border-l-4 border-l-error transition-all duration-300';
            }
        }
    </script>
</body></html>
