<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar for better UI feel */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #c7c4d8;
            border-radius: 10px;
        }
        .tab-transition {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-surface text-on-surface selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation (Shell Implementation) -->
<header class="bg-surface-container-lowest border-b border-outline-variant flex justify-between items-center w-full px-margin-desktop h-16 max-w-container-max mx-auto sticky top-0 z-50">
<div class="text-h3 font-h3 font-bold text-primary">Aitasker</div>
<nav class="hidden md:flex items-center gap-8">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors duration-200" href="#">Hỗ trợ</a>
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors duration-200" href="#">Điều khoản</a>
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors duration-200" href="#">Bảo mật</a>
</nav>
<button class="font-label-md text-label-md text-primary font-semibold hover:opacity-70 transition-opacity">
            Đăng ký
        </button>
</header>
<!-- Main Content Canvas -->
<main class="min-h-[calc(100vh-64px-88px)] flex items-center justify-center p-margin-mobile md:p-12">
<!-- Login Card -->
<div class="w-full max-w-[420px] bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden">
<div class="p-8 pb-0">
<div class="text-center space-y-2 mb-8">
<h1 class="font-h3 text-h3 text-on-surface">Chào mừng trở lại</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Chọn loại tài khoản để tiếp tục hành trình của bạn</p>
</div>
<!-- Tab Switcher (Enterprise vs Freelancer) -->
<div class="p-1 bg-surface-container-low rounded-lg flex mb-8">
<button class="tab-transition flex-1 py-2 text-center rounded-md font-label-md text-label-md bg-surface-container-lowest text-primary shadow-sm border border-outline-variant/30" id="tab-enterprise" onclick="switchTab('enterprise')">
                        Doanh nghiệp
                    </button>
<button class="tab-transition flex-1 py-2 text-center rounded-md font-label-md text-label-md text-on-surface-variant hover:text-on-surface" id="tab-freelancer" onclick="switchTab('freelancer')">
                        Aitasker
                    </button>
</div>
<!-- Login Form -->
<form class="space-y-5" onsubmit="event.preventDefault();">
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface" for="email">Email công việc</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">mail</span>
<input class="w-full h-10 pl-10 pr-4 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-sm text-body-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface" for="password">Mật khẩu</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Quên mật khẩu?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">lock</span>
<input class="w-full h-10 pl-10 pr-12 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-sm text-body-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<div class="flex items-center space-x-2">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary" id="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none" for="remember">Ghi nhớ đăng nhập</label>
</div>
<button class="w-full h-10 bg-primary text-on-primary font-label-md text-label-md rounded-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                        Đăng nhập
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Social Logins -->
<div class="p-8 pt-6">
<div class="relative mb-6">
<div class="absolute inset-0 flex items-center">
<span class="w-full border-t border-outline-variant"></span>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-surface-container-lowest px-2 text-on-surface-variant font-label-sm text-label-sm">Hoặc tiếp tục với</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 h-10 px-4 bg-surface-container-lowest border border-outline-variant rounded-lg font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors">
<img alt="Google" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAkWo0kBLvK5RblvGbvdJoC_kRGf8pVjHssazz0zxeEZ5qGZ6bRWgjAHVaGfvHJS6DhUAiIQUXbv9h2eZ4T1dYVs-DFfYipO8_TKIqs4g1Ig4ddEwQ2R7IeKYfK1W0rJMXyOQSHv64i6o8Q-ng5CpWsgjBjq4fVpYdmVye7UGO-GXtpxyer_lysjuObl-af2sCiFkLi5IYbc-0jo-sLiSjPc2E7dReiuVXQI9kGqkmdD-Mm83rVOJk_s_5G7eVwQrs2AtFnv51FqnM"/>
                        Google
                    </button>
<button class="flex items-center justify-center gap-3 h-10 px-4 bg-surface-container-lowest border border-outline-variant rounded-lg font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"></path></svg>
                        GitHub
                    </button>
</div>
<p class="mt-8 text-center font-body-sm text-body-sm text-on-surface-variant">
                    Chưa có tài khoản? <a class="text-primary font-semibold hover:underline" href="#">Đăng ký ngay</a>
</p>
</div>
</div>
</main>
<!-- Footer (Shell Implementation) -->
<footer class="bg-surface-container-lowest border-t border-outline-variant mt-auto">
<div class="flex flex-col md:flex-row justify-between items-center w-full px-margin-desktop py-8 max-w-container-max mx-auto gap-4">
<div class="font-label-md text-label-md font-bold text-on-surface">Aitasker</div>
<div class="flex gap-8">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-all" href="#">Liên hệ</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-all" href="#">Câu hỏi thường gặp</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-all" href="#">Tuyển dụng</a>
</div>
<div class="font-body-sm text-body-sm text-on-surface-variant">
                © 2024 Aitasker. Tất cả quyền được bảo lưu.
            </div>
</div>
</footer>
<!-- Background Decoration -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] left-[-5%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-5%] w-[40%] h-[40%] bg-secondary-container/10 rounded-full blur-[100px]"></div>
</div>
<script>
        function switchTab(type) {
            const enterpriseTab = document.getElementById('tab-enterprise');
            const freelancerTab = document.getElementById('tab-freelancer');
            const emailLabel = document.querySelector('label[for="email"]');
            
            if (type === 'enterprise') {
                enterpriseTab.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm', 'border', 'border-outline-variant/30');
                enterpriseTab.classList.remove('text-on-surface-variant');
                
                freelancerTab.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-sm', 'border', 'border-outline-variant/30');
                freelancerTab.classList.add('text-on-surface-variant');
                
                emailLabel.textContent = 'Email công việc';
            } else {
                freelancerTab.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm', 'border', 'border-outline-variant/30');
                freelancerTab.classList.remove('text-on-surface-variant');
                
                enterpriseTab.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-sm', 'border', 'border-outline-variant/30');
                enterpriseTab.classList.add('text-on-surface-variant');
                
                emailLabel.textContent = 'Email cá nhân';
            }
        }
    </script>
</body></html>
