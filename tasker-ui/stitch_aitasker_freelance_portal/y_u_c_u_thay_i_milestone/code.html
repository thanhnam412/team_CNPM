<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Create Milestone Change Request</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#e0e3e5",
                        "on-tertiary-container": "#d4dbf5",
                        "on-primary-fixed-variant": "#3323cc",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed-variant": "#3f465c",
                        "primary-fixed": "#e2dfff",
                        "on-surface": "#191c1e",
                        "inverse-on-surface": "#eff1f3",
                        "on-background": "#191c1e",
                        "surface-bright": "#f7f9fb",

<body class="bg-background text-on-background min-h-screen flex flex-col font-sans antialiased">
<!-- TopNavBar: Suppressed because this is a transactional form/task-focused screen -->
<!-- SideNavBar: Suppressed because this is a transactional form/task-focused screen -->
<main class="flex-grow flex items-center justify-center p-4 md:p-8">
<div class="w-full max-w-2xl bg-surface-container-lowest rounded-lg border border-outline-variant p-6 md:p-8 shadow-sm">
<div class="flex items-center justify-between mb-8 border-b border-outline-variant pb-4">
<div>
<h1 class="font-h3 text-h3 text-on-surface">Create Milestone Change Request</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Submit a formal request to modify the scope, deadline, or payment of an existing milestone.</p>
</div>
<button aria-label="Close" class="p-2 text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<form class="space-y-6">
<!-- Change Type -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2">Change Type</label>
<div class="grid grid-cols-1 md:grid-cols-3 gap-3">
<label class="relative flex items-center p-3 border border-outline-variant rounded cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:border-primary has-[:checked]:bg-primary-fixed/20">
<input checked="" class="w-4 h-4 text-primary bg-surface border-outline-variant focus:ring-primary focus:ring-2" name="change_type" type="radio" value="scope">
<span class="ml-2 font-body-sm text-body-sm text-on-surface">Scope</span>
<span class="material-symbols-outlined ml-auto text-on-surface-variant text-sm" data-icon="architecture">architecture</span>
</label>
<label class="relative flex items-center p-3 border border-outline-variant rounded cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:border-primary has-[:checked]:bg-primary-fixed/20">
<input class="w-4 h-4 text-primary bg-surface border-outline-variant focus:ring-primary focus:ring-2" name="change_type" type="radio" value="deadline">
<span class="ml-2 font-body-sm text-body-sm text-on-surface">Deadline</span>
<span class="material-symbols-outlined ml-auto text-on-surface-variant text-sm" data-icon="event">event</span>
</label>
<label class="relative flex items-center p-3 border border-outline-variant rounded cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:border-primary has-[:checked]:bg-primary-fixed/20">
<input class="w-4 h-4 text-primary bg-surface border-outline-variant focus:ring-primary focus:ring-2" name="change_type" type="radio" value="payment">
<span class="ml-2 font-body-sm text-body-sm text-on-surface">Payment</span>
<span class="material-symbols-outlined ml-auto text-on-surface-variant text-sm" data-icon="payments">payments</span>
</label>
</div>
</div>
<!-- Reason for Change -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="reason">Reason for Change</label>
<textarea class="w-full bg-surface border border-outline-variant rounded px-3 py-2 font-body-sm text-body-sm text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow placeholder:text-on-surface-variant/50" id="reason" name="reason" placeholder="Describe the necessity for this change request..." rows="3"></textarea>
</div>
<!-- New Proposed Details -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="details">New Proposed Details</label>
<textarea class="w-full bg-surface border border-outline-variant rounded px-3 py-2 font-body-sm text-body-sm text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow placeholder:text-on-surface-variant/50" id="details" name="details" placeholder="Provide specific details of the proposed modifications..." rows="4"></textarea>
</div>
<!-- Impact Assessment -->
<div class="bg-surface-container-low rounded p-4 border border-outline-variant border-dashed">
<label class="block font-label-md text-label-md text-on-surface mb-2 flex items-center gap-2" for="impact">
<span class="material-symbols-outlined text-sm text-secondary" data-icon="analytics">analytics</span>
                        Impact Assessment (Optional)
                    </label>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-3">Briefly describe how this change affects other milestones or overall project delivery.</p>
<textarea class="w-full bg-surface border border-outline-variant rounded px-3 py-2 font-body-sm text-body-sm text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow placeholder:text-on-surface-variant/50" id="impact" name="impact" placeholder="e.g., Delays phase 3 by one week." rows="2"></textarea>
</div>
<!-- Form Actions -->
<div class="flex justify-end gap-3 pt-4 border-t border-outline-variant mt-8">
<button class="px-4 py-2 h-10 rounded font-label-md text-label-md bg-surface text-on-surface border border-outline-variant hover:bg-surface-container-high transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="button">
                        Cancel
                    </button>
<button class="px-4 py-2 h-10 rounded font-label-md text-label-md bg-primary text-on-primary hover:bg-primary-fixed-variant transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 flex items-center gap-2" type="submit">
<span class="material-symbols-outlined text-sm" data-icon="send">send</span>
                        Submit Request
                    </button>
</div>
</form>
</div>
</main>
<!-- Footer: Suppressed because this is a transactional form/task-focused screen -->
</body></html>
