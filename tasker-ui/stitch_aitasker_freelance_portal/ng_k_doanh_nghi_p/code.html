<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- Top Navigation Shell -->
<header class="bg-surface-container-lowest border-b border-outline-variant flex justify-between items-center w-full px-margin-desktop h-16 max-w-container-max mx-auto top-0 z-50">
<div class="text-h3 font-h3 font-bold text-primary">Aitasker</div>
<div class="hidden md:flex items-center gap-8">
<nav class="flex gap-6">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors duration-200" href="#">Hỗ trợ</a>
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors duration-200" href="#">Điều khoản</a>
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors duration-200" href="#">Bảo mật</a>
</nav>
<button class="font-label-md text-label-md text-primary font-semibold hover:opacity-70 transition-opacity">Đăng nhập</button>
</div>
</header>
<main class="flex-grow flex items-center justify-center py-12 px-margin-mobile md:px-0 relative overflow-hidden">
<!-- Abstract Background Element -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-40">

</div>
<div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl p-8 z-10">
<!-- Header section -->
<div class="mb-8 text-center">
<h1 class="font-h3 text-h3 mb-2 text-on-surface">Tạo tài khoản mới</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Tham gia cùng hàng nghìn doanh nghiệp đang phát triển cùng Aitasker</p>
</div>
<!-- Shadcn-style Tab Switcher -->
<div class="bg-surface-container p-1 rounded-lg flex mb-8">
<button class="flex-1 py-1.5 px-3 font-label-md text-label-md text-on-surface-variant transition-all">Cá nhân</button>
<button class="flex-1 py-1.5 px-3 bg-surface-container-lowest rounded-md font-label-md text-label-md text-on-surface font-semibold shadcn-tab-active transition-all">Doanh nghiệp</button>
</div>
<!-- Form -->
<form action="#" class="space-y-5" onsubmit="return false;">
<!-- Company Name -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface" for="company-name">Tên công ty</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">domain</span>
<input class="w-full pl-10 pr-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary font-body-sm text-body-sm outline-none transition-all" id="company-name" placeholder="Công ty TNHH Aitasker" type="text">
</div>
</div>
<!-- Business Email -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface" for="email">Email công việc</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">mail</span>
<input class="w-full pl-10 pr-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary font-body-sm text-body-sm outline-none transition-all" id="email" placeholder="name@company.com" type="email">
</div>
</div>
<!-- Password -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface" for="password">Mật khẩu</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">lock</span>
<input class="w-full pl-10 pr-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary font-body-sm text-body-sm outline-none transition-all" id="password" placeholder="••••••••" type="password">
</div>
</div>
<!-- Confirm Password -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface" for="confirm-password">Xác nhận mật khẩu</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">shield</span>
<input class="w-full pl-10 pr-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary font-body-sm text-body-sm outline-none transition-all" id="confirm-password" placeholder="••••••••" type="password">
</div>
</div>
<!-- Terms & Conditions Checkbox -->
<div class="flex items-start gap-3 py-2">
<div class="flex items-center h-5">
<input class="w-4 h-4 text-primary border-outline-variant rounded focus:ring-primary cursor-pointer" id="terms" type="checkbox">
</div>
<label class="font-body-sm text-body-sm text-on-surface-variant" for="terms">
                        Tôi đồng ý với các <a class="text-primary hover:underline transition-all" href="#">điều khoản và điều kiện</a> của Aitasker.
                    </label>
</div>
<!-- Primary Action Button -->
<button class="w-full py-2.5 bg-primary text-on-primary font-label-md text-label-md font-bold rounded-lg hover:opacity-90 active:scale-[0.98] transition-all flex justify-center items-center gap-2" type="submit">
                    Đăng ký tài khoản doanh nghiệp
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Social Login Splitter -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center"><span class="w-full border-t border-outline-variant"></span></div>
<div class="relative flex justify-center text-label-sm uppercase"><span class="bg-surface-container-lowest px-2 text-on-surface-variant">Hoặc tiếp tục với</span></div>
</div>
<!-- Social Button Group -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-2 px-4 border border-outline-variant rounded-lg font-label-md text-label-md hover:bg-surface-container transition-colors">
<img alt="Google" class="w-4 h-4" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBripvqEcvuX_ASN_i_J33C0VUhQew8rPLDUX5V7BS_g2WXzzJC7mxRuOa8XijZYKbmNaOlh5euego5OoWTj2cEsoXMdSA4_IPQgqB4zwX1ktV6ErUB2Cu9WK4trlRgE0xs2tw6jyScz8MgkFHdDrwWqiBAzlNUjvgpVhT9YPvagqVmtNY81EGWP6gNu-sooYC5k6C6l3LPUR_ksfLN4f4xNcZe_RDS5RKVpR1JcM4rIc0giN4OzjE8aXoFe4sWvvFxm2yvZUj6IYs">
                   Google
                </button>
<button class="flex items-center justify-center gap-2 py-2 px-4 border border-outline-variant rounded-lg font-label-md text-label-md hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-[18px] text-on-surface">corporate_fare</span>
                    SSO
                </button>
</div>
<p class="mt-8 text-center font-body-sm text-body-sm text-on-surface-variant">
                Bạn đã có tài khoản? <a class="text-primary font-semibold hover:underline" href="#">Đăng nhập ngay</a>
</p>
</div>
</main>
<!-- Footer Shell -->
<footer class="bg-surface-container-lowest border-t border-outline-variant py-8 px-margin-desktop w-full max-w-container-max mx-auto">
<div class="flex flex-col md:flex-row justify-between items-center gap-4">
<div class="flex items-center gap-4">
<span class="font-label-md text-label-md font-bold text-on-surface">Aitasker</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">© 2024 Aitasker. Tất cả quyền được bảo lưu.</span>
</div>
<div class="flex gap-6">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-all" href="#">Liên hệ</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-all" href="#">Câu hỏi thường gặp</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-all" href="#">Tuyển dụng</a>
</div>
</div>
</footer>
<script>
        // Micro-interactions for form focus
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined')?.classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined')?.classList.remove('text-primary');
            });
        });
    </script>
</body></html>
